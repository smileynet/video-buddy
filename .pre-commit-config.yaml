# Run: pre-commit install
# To upgrade hook versions: pre-commit autoupdate

repos:
  # Generic hygiene: line endings, trailing whitespace, YAML/TOML validity, large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Ruff: lint + format in one tool
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Secret scanning: catches API tokens before they reach the remote.
  # GitHub push protection is a backstop, not a primary defense.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
