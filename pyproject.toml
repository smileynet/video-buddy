[project]
name = "video-buddy"
version = "0.1.0"
description = "Mechanical CLI for turning YouTube videos, articles, and papers into structured Markdown notes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.0",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "pymupdf4llm>=0.0.17",
    "requests>=2.31.0",
    "scenedetect>=0.6",
    "trafilatura>=2.0.0",
    "yt-dlp>=2026.6.9",
    "yt-dlp-ejs>=0.8",
]

[project.optional-dependencies]
gpu-ocr = ["easyocr>=1.7"]
ocr-cpu = ["pytesseract>=0.3.10"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6",
]

[project.scripts]
video-buddy = "video_buddy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_buddy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
